# crunk design spec for the SADI web UI. The palette, scales and type here mirror the tokens in
# src/styles.css (light values in [palette], dark values in [palette.modes.dark]); the
# generated src/tokens.css is committed and `crunk tokens --check` (CI) fails on drift.
# crunk version pin: 0.532.0 (see docs/web/wizard.md).
[project]
css_root = "src"
tokens_file = "tokens.css"
root_font_size = 16

[palette]
bg = "#d6ebd0"
surface = "#e6f5e1"
surface-2 = "#c5dfbe"
fg = "#06200c"
muted = "#2b5636"
accent = "#0a5a2a"
accent-fg = "#e6f5e1"
accent-soft = "#b9dcb1"
border = "#3a6845"
line = "#a6c79e"
focus = "#8a4400"
btn-bg = "#cbe4c4"
ok = "#0a5a2a"
ok-soft = "#c3e6bb"
warn = "#5e3b00"
warn-soft = "#efdfa6"
bad = "#9a1a10"
bad-soft = "#f2d4cd"

[palette.modes.dark]
bg = "#070b07"
surface = "#0c130c"
surface-2 = "#132013"
fg = "#7dff9a"
muted = "#6cc784"
accent = "#5dffa0"
accent-fg = "#03100a"
accent-soft = "#0f3a20"
border = "#4fa468"
line = "#1d3a25"
focus = "#ffd24a"
btn-bg = "#10200f"
ok = "#7bffa0"
ok-soft = "#0e3a1a"
warn = "#ffcf5a"
warn-soft = "#3a2d08"
bad = "#ff8a80"
bad-soft = "#3f1512"
[palette.roles]
body = ["fg", "bg"]
card = ["fg", "surface"]
muted = ["muted", "surface"]
primary = ["accent-fg", "accent"]
success = ["ok", "ok-soft"]
warning = ["warn", "warn-soft"]
danger = ["bad", "bad-soft"]

[scales]
spacing = [0, 4, 8, 12, 16, 24, 32]
font_sizes = [12.48, 14, 16, 20, 25.6]
radii = [0, 2, 3, 999]

[typography]
families = ["ui-monospace"]
weights = [400, 450, 550, 600, 650, 700, 750]

[org]
buckets = ["base"]
tokens_only_custom_props = false
entry = ["styles.css", "theme.css"]

[decisions]
fonts = "System monospace stack on purpose: a terminal look that renders natively and offline, with no webfont fetch."

[lint]
# styles.css predates the spec and uses ad-hoc rem spacing/sizes; this crunk version has no
# warn-only mode (warn == error), so the legacy scale rules are off until the CSS is migrated.
# Type weights, roles, org layout and token drift stay enforced.
# COLOR001 is off because it flags every hex literal in the hand-written token definitions of
# theme.css (no per-file exclusion exists); src/a11y/contrast.test.ts checks theme.css against the
# [palette] above instead.
COLOR001 = "off"
SPACE001 = "off"
SIZE001 = "off"
TYPE001 = "off"
