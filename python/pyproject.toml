[project]
name = "sadi"
version = "0.1.0"
description = "SADI: portable local web app replacing the reference lab VI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "typani",
    "numpy",
    "scipy",
    "uvicorn",
    "sympy",
    "pint",
    "hypothesis",
    "crc32c>=2.9.post0",
    "psutil",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sadi-store = "sadi.cli.store:main"

[tool.hatch.build.targets.wheel]
packages = ["sadi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["sadi", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"
# typing.override needs Python 3.12; project floor is 3.11.
missing-override-decorator = "ignore"
