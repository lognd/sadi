[project]
name = "sadi"
version = "0.1.0"
description = "SADI: portable local web app replacing the reference lab VI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "typani",
    "numpy",
    "scipy",
    "uvicorn",
    "sympy",
    "pint",
    "hypothesis",
    "crc32c>=2.9.post0",
    "psutil",
    "packaging",
]

[project.optional-dependencies]
# sadi_py is a maturin-built PyO3 extension (crates/sadi-py), not on PyPI:
# build it with `maturin develop` (see docs/packaging.md). The extra is empty
# so the pure-Python install never requires a Rust toolchain.
device = []

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "ty",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sadi = "sadi.launcher:main"
sadi-store = "sadi.cli.store:main"
sadi-plugins = "sadi.cli.plugins:main"
sadi-doctor = "sadi.doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sadi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"sadi/doctor/**" = ["E501"]  # long human-readable remediation text
"tests/doctor/**" = ["E501"]

[tool.ty.environment]
python-version = "3.11"
# sadi_py is maturin-built; resolve it statically from its checked-in stubs.
extra-paths = ["../crates/sadi-py/python"]

[tool.ty.src]
include = ["sadi", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
all = "error"
# typing.override needs Python 3.12; project floor is 3.11.
missing-override-decorator = "ignore"
