body = "LocalDirSource loads plugins by path without install: scans SADI_PLUGIN_PATH (os.pathsep list) or settings plugin_paths; defaults plugins/ and private/*/plugin relative to repo root when present. Each plugin dir needs sadi_plugin.toml; importlib spec_from_file_location under a namespaced module name (sadi_local_plugins.<id>) so it never shadows core. Missing dirs are not errors; unreadable/invalid ones yield per-plugin PluginSourceError records. Add plugins/ to .gitignore (private/ already ignored). PluginSettings pydantic model (plugin_paths, config dir for enable/disable state)."
