body = "In-memory FakeDwf implementing the DwfBackend Protocol (from ~SHEH6FP) with a deterministic model: analog out channels generate waveforms (dc/sine/ramp/custom), scope channels sample them with configurable gain/offset/noise, so tests run with no hardware. Plus sadi.bench.inject: helpers that drive a DwfBackend to inject LVDT-like and load-channel analog signals toward a SADI board and capture its outputs, written against the Protocol so the same test runs on real AD3 hardware later. Wiring/pin mapping is configuration (pydantic) not hard-coded; real-board mapping is unknown and left as TODO ticket for the hardware session. Compose with the existing sadi simulator where useful (loopback test: FakeDwf waveform -> expected SADI ADC counts via the simulator model). Standards: ASCII only; module logger never print; docstring on every public symbol; docs Status: header; tests in same change; Python only. typani Result/ErrorSet, pydantic. NEVER add Co-Authored-By."
