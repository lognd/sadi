body = "Design for a 'sadi doctor' that checks EVERYTHING and instructs the user STEP-BY-STEP how to fix each problem. Covers: check catalog by layer (OS/platform, Python+uv env, Rust extension sadi-py import, web bundle present, ports, data dir writable+free space+fs type+fsync support, session locks and torn-tail/orphan sessions, WAL integrity scan, USB/FTDI presence, udev/driver/permissions per OS incl. WSL usbipd, device firmware/protocol probe, simulator self-test, clock/timezone, CPU/RAM, worker pool spawn test, browser launch); check API (id, severity, status pass/warn/fail/skip, evidence, ordered remediation steps with exact copy-paste commands per OS, verify-step re-run); read-only by default, never mutates data, fixes only on explicit user action; machine-readable JSON plus human text; usable from CLI and as a UI Doctor screen; fixture-driven tests; links to docs/portability.md and docs/hardware-verification.md."
