scope = ["web/src/keys/**"]
body = "Found while working ~W5XJBZT (usability pass). useKeyCapture only exempts INPUT/TEXTAREA/SELECT, so with Tab focus on a button or link, Enter resolves to 'primary' (complete step) and Space to 'accept', both preventDefault'd: the focused control never activates. Repro: LVDT step, Tab to 'Mark load change', Enter -> the step completes with no points. Same for Skip this step, Download link, Edit/Exclude buttons on Review. Fix: in useKeyCapture/resolveKey return null for Enter/Space when the target is a button, link, summary or role=button/link; add keymap tests; extend e2e to activate controls via Tab+Enter."
